{% extends './layout.html' %}
{% block content %}

<div class="p-6 max-w-xl mx-auto">
 
  <div class="p-4 border-b flex justify-between items-center">
    <h2 class="text-lg font-semibold mb-4">
      Tambah Aset - {{ kelompok.nmKelo }}
    </h2>
    <button onclick="window.history.back()"
        class="px-4 py-2 text-sm border rounded-lg hover:bg-zinc-100">
        ← Kembali
    </button>
    <!-- <a href="{% url 'kelompok_detail' kelompok.id %}"
      class="px-3 py-2 text-sm border rounded-lg hover:bg-zinc-100">
      ← Kembali
    </a>   -->
  </div>

  <form method="post" class="space-y-4 bg-white p-4 rounded-xl shadow">
    {% csrf_token %}

    <input name="namaAset" placeholder="Nama Aset" class="w-full p-2 border rounded">

    <input name="jumlah" type="number" placeholder="Jumlah" class="w-full p-2 border rounded">

    <select name="kondisi" class="w-full p-2 border rounded">
      <option value="baik">Baik</option>
      <option value="rusak">Rusak</option>
      <option value="perlu_perbaikan">Perlu Perbaikan</option>
    </select>

    <input name="nilai" type="number" placeholder="Nilai" class="w-full p-2 border rounded">

    <div class="flex justify-end gap-2">
      <button class="px-4 py-2 bg-blue-500 text-white rounded">
        Simpan
      </button>
    </div>

  </form>

</div>

{% endblock %}
