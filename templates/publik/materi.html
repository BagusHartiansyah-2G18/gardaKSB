{% extends './layout.html' %}
{% load static %}

{% block content %}
<style>
    .pdf-viewer {

        background: #e5e7eb;

        min-height: 100vh;

        padding: 40px 20px;

        overflow: auto;
    }
    .article-layout {
        display: flex;
        gap: 5%;
        align-items: flex-start;
        padding: 0px !important;
        margin: 0px !important;
        max-width:unset
    } 

    /* Tablet */

    @media (max-width: 991px) {

        .article-layout {
            flex-direction: column;
            gap: 30px; 
            align-items: center;
        }

        .article-main,
        .article-sidebar {
            width: 100%;
        }

    }

    /* Mobile */

    @media (max-width: 768px) {

        .article-layout {
            gap: 20px;
        }

        .article-main {
            width: 100%;
        }

        .article-sidebar {
            width: 100%;
        }

    }
    .article-main {
        width: 70%;
    }

    .article-sidebar {
        width: 25%;
    }
    #pdf-pages {

        max-width: 1100px;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 30px;
    }

    .pdf-page {

        background: white;

        border-radius: 8px;

        box-shadow:
            0 20px 40px rgba(0, 0, 0, .12);

        max-width: 100%;
    }


    .pdf-header {

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 16px;

        padding: 24px 30px;

        background:
            linear-gradient(135deg,
                #0f172a,
                #1e293b);

        color: white;

    }

    .pdf-header-title h3 {

        margin: 0;

        font-size: 22px;
        font-weight: 700;

    }

    .pdf-header-title p {

        margin: 4px 0 0;

        opacity: .8;

        font-size: 14px;

    }

    .pdf-actions {

        display: flex;
        gap: 10px;
    }

    .pdf-btn {

        display: inline-flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        padding: 12px 18px;

        border-radius: 12px;

        text-decoration: none;

        font-weight: 600;
        font-size: 14px;

        transition: .3s;

    }

    .pdf-btn-open {

        background: #2563eb;
        color: white;

    }

    .pdf-btn-open:hover {

        background: #1d4ed8;
        transform: translateY(-2px);

    }

    .pdf-btn-download {

        background: #16a34a;
        color: white;

    }

    .pdf-btn-download:hover {

        background: #15803d;
        transform: translateY(-2px);

    }

    .pdf-viewer {

        background: #f8fafc;

        padding: 30px;

        min-height: 400px;
    }

    #pdf-pages {

        max-width: 900px;
        margin: auto;
    }

    .pdf-page {

        width: 100%;

        margin-bottom: 25px;

        border-radius: 14px;

        background: white;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, .08);

        overflow: hidden;

        display: block;
    }

    .pdf-empty {

        text-align: center;

        padding: 80px 20px;

        color: #64748b;
    }

    .pdf-reader {

        background: #dfe3e8;

        display: flex;
        justify-content: center;

        padding: 30px;

        min-height: 80vh;
    }

    #pdfCanvas {

        background: white;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, .15);

        border-radius: 6px;
    }

    .pdf-toolbar {

        position: sticky;
        top: 0;
        z-index: 100;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 15px;

        padding: 15px;

        background: white;

        box-shadow:
            0 2px 10px rgba(0, 0, 0, .08);
    }

    .pdf-toolbar button {

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 50%;

        background: #2563eb;
        color: white;

        cursor: pointer;
    }

    .pdf-empty i {

        font-size: 60px;

        display: block;

        margin-bottom: 15px;
    }

    @media(max-width:768px) {

        .pdf-header {

            flex-direction: column;
            align-items: stretch;

        }

        .pdf-actions {

            width: 100%;
        }

        .pdf-btn {

            flex: 1;
        }

        .pdf-viewer {

            padding: 15px;
        }

    }

    .pdf-float-btn {
        top: 50%;

        transform: translateY(-50%);

        width: 60px;
        height: 60px;

        border: none;

        border-radius: 50%;

        background: rgba(15, 23, 42, .9);

        color: white;

        font-size: 24px;

        cursor: pointer;

        z-index: 9999;

        transition: .2s;
        position: absolute;
    }

    .pdf-float-btn:hover { 
        transform:
            translateY(-50%) scale(1.08);

        background: #2563eb;
    }

    .pdf-prev {
        left: 5%;
        top: 500px;

    }

    .pdf-next {
        right: 5%;
        top: 500px;

    }
</style>
<section class="section_hero loss">
    <div class="hero-gap home-pd">
        <div class="w-layout-blockcontainer container-main relative w-container article-layout">
            <div class="article-section article-main">
                {% if dmateriOn %} 
                    <div > 
                        <div class="pdf-toolbar" style="position: relative;">
                            <button id="prevPage" class="pdf-float-btn pdf-prev ">
                                ◀
                            </button>

                            <span id="pageInfo"></span>

                            <button id="nextPage" class="pdf-float-btn pdf-next">
                                ▶
                            </button>
                            <a href="{{ berita.file_pdf.url }}">Donwload</a>
                        </div>


                        <div class="pdf-reader">

                            <canvas id="pdfCanvas"></canvas>

                        </div>
                    </div>
                    {% endif %}
            </div>
            <div class="related-news article-sidebar" style="background-color: whitesmoke; border-radius: 10px; padding: 10px;"> 
                <div class="blog-collection-list-v3 w-dyn-items" role="list" >
                    <h3 style="color: black;">Daftar Materi</h3>
                    <small>{{dmateriOn.user__userprofile__bidang__nama}}</small>
                    <hr/>
                    <div class="blog-collection-item w-dyn-item" role="listitem" >
                        <ul class="materi-list">

                            {% for o in dmateri %}
                            <li>
                                <a href="{% url 'materiBidangs' bidang o.id %}">
                                    {{ o.judul }}
                                </a>
                            </li> 
                            {% endfor %}

                        </ul>

                    </div>
                </div>

            </div>

        </div>
    </div>
</section>

<style>
    .materi-list {
        margin: 0;
        margin-left: 10px;
        padding-left: 20px;
    }

    .materi-list li {
        margin-bottom: 10px;
    }

    .materi-list a {
        color: #1f2937;
        text-decoration: none;
        font-weight: 500;
    }

    .materi-list a:hover {
        color: #2563eb;
    }
    .loss {
        position: unset !important;
        overflow: unset;
        height: auto;
    }

    .related-news {
        margin: 20px 0px;
    }

    .article-cover-wrap {
        width: 100%;
        overflow: hidden;
        border-radius: 20px;
        margin: 24px 0 32px;
    }

    .article-cover-wrap img {
        width: 100%;
        height: auto;
        display: block;

        aspect-ratio: 16 / 9;
        object-fit: cover;
        object-position: center;

        border-radius: 20px;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.12);
    }


    .article-section {
        padding: 80px 0;
        background: #f8fafc;
        border-radius: 10px;
    }

    .article-container {
        max-width: 920px;
        margin: auto;
        padding: 0 20px;
    }

    .article-header {
        margin-bottom: 30px;
    }

    .article-category {
        display: inline-block;
        padding: 8px 14px;

        background: #2563eb;
        color: white;

        border-radius: 999px;

        font-size: 13px;
        font-weight: 600;

        margin-bottom: 20px;
    }

    .article-title {
        font-size: 48px;
        line-height: 1.2;
        font-weight: 800;

        margin: 0 0 20px;
        color: #111827;
    }

    .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;

        color: #64748b;
        font-size: 14px;
    }

    .article-cover-wrap {
        margin-bottom: 40px;
    }

    .article-cover {
        width: 100%;
        display: block;

        border-radius: 24px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, .1);
    }

    .article-content {

        background: white;

        padding: 40px;

        border-radius: 24px;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, .05);

        font-size: 18px;
        line-height: 1.9;
        color: #374151;
    }

    .article-content p {
        margin-bottom: 24px;
    }

    .article-content img {
        max-width: 100%;
        height: auto;

        border-radius: 16px;

        margin: 20px 0;
    }

    .article-content h2,
    .article-content h3,
    .article-content h4 {
        color: #111827;
        margin-top: 35px;
    }

    .article-download {

        margin-top: 30px;

        padding: 30px;

        background: white;

        border-radius: 24px;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, .05);
    }

    .download-btn {

        display: inline-flex;
        align-items: center;
        gap: 10px;

        padding: 14px 22px;

        background: #2563eb;
        color: white;

        border-radius: 12px;

        text-decoration: none;
        font-weight: 600;

        transition: .3s ease;
    }

    .download-btn:hover {

        background: #1d4ed8;

        transform: translateY(-2px);

    }

    @media (max-width: 768px) {

        .article-title {
            font-size: 32px;
        }

        .article-content {
            padding: 24px;
            font-size: 16px;
        }

    }

    .pdf-viewer {
        background: #f5f7fa;
        padding: 20px;
        border-radius: 20px;
    }
</style> 
{% if dmateriOn.file_pdf %}
<script type="module">

    import * as pdfjsLib
        from "/static/vendor/pdf/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "/static/vendor/pdf/pdf.worker.min.mjs";

    const pdfUrl =
        "{{ dmateriOn.file_pdf|escapejs }}";

    let pdfDoc = null;
    let currentPage = 1;

    const canvas =
        document.getElementById(
            "pdfCanvas"
        );

    const context =
        canvas.getContext("2d");

    async function renderPage(pageNumber) {

        const page =
            await pdfDoc.getPage(
                pageNumber
            );

        const viewport =
            page.getViewport({
                scale: 1.5
            });

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;

        document.getElementById(
            "pageInfo"
        ).innerHTML = `
            Halaman
            ${pageNumber}
            /
            ${pdfDoc.numPages}
        `;
    }

    if (pdfUrl) { 
        const loadingTask =
            pdfjsLib.getDocument({
                url:
                    window.location.origin+"/media/"+
                    pdfUrl
            });

        pdfDoc =
            await loadingTask.promise;

        await renderPage(1);

    }

    document
        .getElementById(
            "prevPage"
        )
        .addEventListener(
            "click",
            async function () {

                if (
                    currentPage <= 1
                ) {
                    return;
                }

                currentPage--;

                await renderPage(
                    currentPage
                );

            }
        );

    document
        .getElementById(
            "nextPage"
        )
        .addEventListener(
            "click",
            async function () {

                if (
                    currentPage >=
                    pdfDoc.numPages
                ) {
                    return;
                }

                currentPage++;

                await renderPage(
                    currentPage
                );

            }
        );

</script>
{% endif %}

{% endblock %}
