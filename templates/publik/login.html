{% extends './layout.html' %}

{% block content %}
    <div class="mx-auto flex w-full max-w-2xl flex-col px-4 sm:px-6 mb-2">
        
        <div class="relative mt-12 sm:mt-16"><svg viewBox="0 0 1090 1090" aria-hidden="true" fill="none"
                preserveAspectRatio="none" width="1090" height="1090"
                class="absolute -top-7 left-1/2 -z-10 h-[788px] -translate-x-1/2 mask-[linear-gradient(to_bottom,white_20%,transparent_75%)] stroke-gray-300/30 sm:-top-9 sm:h-auto">
                <circle cx="545" cy="545" r="544.5"></circle>
                <circle cx="545" cy="545" r="480.5"></circle>
                <circle cx="545" cy="545" r="416.5"></circle>
                <circle cx="545" cy="545" r="352.5"></circle>
            </svg>
            <h1 class="text-center text-2xl font-medium tracking-tight text-gray-900">Sign in to account</h1>
            <p class="mt-3 text-center text-lg text-gray-600">Don’t have an account? <a class="text-cyan-600"
                    href="#">Sign up</a> for a free trial.</p>
        </div>
        <div
            class="-mx-4 mt-10 flex-auto bg-white px-4 py-10 shadow-2xl shadow-gray-900/10 sm:mx-0 sm:flex-none sm:rounded-5xl sm:p-24">
            <form action="{% url 'sigin' %}" method="post">
                
                {% csrf_token %}
                <div class="space-y-6">
                    <div><label for="_S_3_" class="mb-2 block text-sm font-semibold text-gray-900">Username</label><input id="_S_3_" autocomplete="text" required=""
                            class="block w-full appearance-none rounded-lg border border-gray-200 bg-white py-[calc(--spacing(2)-1px)] px-[calc(--spacing(3)-1px)] text-gray-900 placeholder:text-gray-400 focus:border-cyan-500 focus:outline-hidden focus:ring-cyan-500 sm:text-sm"
                            type="text" name="username"></div>
                    <div><label for="_S_4_" class="mb-2 block text-sm font-semibold text-gray-900">Password</label><input
                            id="_S_4_" autocomplete="current-password" required=""
                            class="block w-full appearance-none rounded-lg border border-gray-200 bg-white py-[calc(--spacing(2)-1px)] px-[calc(--spacing(3)-1px)] text-gray-900 placeholder:text-gray-400 focus:border-cyan-500 focus:outline-hidden focus:ring-cyan-500 sm:text-sm"
                            type="password" name="password"></div>
                </div><button
                    class="inline-flex justify-center rounded-lg py-2 px-3 text-sm font-semibold transition-colors relative overflow-hidden bg-cyan-500 text-white before:absolute before:inset-0 active:before:bg-transparent hover:before:bg-white/10 active:bg-cyan-600 active:text-white/80 before:transition-colors mt-8 w-full"
                    type="submit" color="cyan" variant="solid">Sign in to account</button>
            </form> 
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-100 text-red-700 p-2 mb-3 rounded">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

        </div>
    </div>
{% endblock %}
