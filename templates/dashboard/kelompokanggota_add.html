{% extends './layout.html' %}
{% block content %}

<div class="p-6 max-w-xl mx-auto">

  
  <div class="p-4 border-b flex justify-between items-center">
    <h2 class="text-lg font-semibold mb-4">
      Tambah Anggota - {{ kelompok.nmKelo }}
    </h2>
    <button onclick="window.history.back()"
        class="px-4 py-2 text-sm border rounded-lg hover:bg-zinc-100">
        ← Kembali
    </button>
    <!-- <a href="{% url 'kelompok_detail' kelompok.id %}"
      class="px-3 py-2 text-sm border rounded-lg hover:bg-zinc-100">
      ← Kembali
    </a>   -->
  </div>
  <form method="post" class="space-y-4 bg-white p-4 rounded-xl shadow">
    {% csrf_token %}

    <input name="nama" placeholder="Nama" class="w-full p-2 border rounded">

    <select name="jabatan" class="w-full p-2 border rounded">
      <option value="ketua">Ketua</option>
      <option value="sekretaris">Sekretaris</option>
      <option value="bendahara">Bendahara</option>
      <option value="anggota">Anggota</option>
    </select>

    <input name="noHp" placeholder="No HP" class="w-full p-2 border rounded">

    <textarea name="alamat" placeholder="Alamat" class="w-full p-2 border rounded"></textarea>

    <div class="flex justify-end gap-2">
      <button class="px-4 py-2 bg-blue-500 text-white rounded">
        Simpan
      </button>
    </div>

  </form>

</div>

{% endblock %}
